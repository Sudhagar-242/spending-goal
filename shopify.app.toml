# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4f643e6d6f502106eb41e5ca7f377516"
name = "Zuper Apps Shipping Threshold"
application_url = "https://heart-irc-activity-tunnel.trycloudflare.com"
embedded = true
handle = "zuper-apps-shipping-threshold"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update" 

  [[webhooks.subscriptions]]
  topics = [ "themes/update" ]
  uri = "/webhooks/themes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,write_discounts,read_themes,read_shipping"

[auth]
redirect_urls = ["https://heart-irc-activity-tunnel.trycloudflare.com/auth/callback", "https://heart-irc-activity-tunnel.trycloudflare.com/auth/shopify/callback", "https://heart-irc-activity-tunnel.trycloudflare.com/api/auth/callback"]

[pos]
embedded = false
